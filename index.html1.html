<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cristine Praxs Egot — Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --primary-color: #007bff; /* Чистый синий */
            --text-color: #333;
            --accent-bg: #e9ecef;
            --border-color: #dee2e6;
        }
        body {
            background: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
            animation: fadeIn .6s ease;
        }
        h1 {
            margin-top: 0;
            font-size: 28px;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        h1 span { margin-left: 10px; font-size: 1.5rem; }

        p {
            font-size: 15px;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--primary-color);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            transition: background .25s, transform 0.1s;
            font-weight: 500;
        }
        a.btn:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }
        .info-block {
            background: var(--accent-bg);
            padding: 15px;
            border-radius: 8px;
            margin: 25px 0;
            font-size: 14px;
        }
        .info-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #495057;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
        }
        .info-row > div:first-child {
            color: #6c757d;
        }
        
        .info-row > div:last-child {
            word-break: break-all;
            text-align: right;
            max-width: 65%;
            font-weight: 500;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">

    <h1>This is my project Cristine Praxs Egot</h1>
    <p>Using KsWeb apache in Android</p>









</div>
</body>
</html>
